<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body><header><b>🛒 VENTAS YUPI DILAN · ADMIN</b><a href="/">Tienda</a></header><section><small>🛠️ ADMINISTRACIÓN</small><h2>Pedidos</h2><div id="x" class="box">Cargando...</div></section><script>
async function load(){let r=await fetch("/api/admin/orders");if(!r.ok)return x.textContent="Acceso no autorizado.";let d=await r.json();x.innerHTML=d.map(o=>`<div style="padding:15px;border-bottom:1px solid #28323c"><b>${o.public_id}</b> · ${o.product} · $${o.price}<br>👤 ${o.customer||""} · ${o.email||""}<br>🎮 ${o.player_name} · ID ${o.player_id}<br>Estado: ${o.status}<br><a target="_blank" href="/api/admin/receipt/${o.receipt}">📎 Ver comprobante</a>${o.status==="AWAITING_PAYMENT"?`<br><button onclick="act('${o.public_id}','confirm')">✅ Confirmar pago y enviar</button> <button onclick="act('${o.public_id}','reject')">❌ Rechazar</button>`:""}</div>`).join("")||"Sin pedidos."}
async function act(id,a){let r=await fetch("/api/admin/orders/"+id+"/"+a,{method:"POST"}),d=await r.json();alert(r.ok?(a==="confirm"?"Pago confirmado: recarga enviada al proveedor.":"Pedido rechazado."):d.error);load()}load();</script></body></html>
